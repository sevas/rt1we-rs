name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test
    - name: Render image
      run: |
        mkdir out
        cargo run -p rt1we_sample --release
    - name: upload last render
      uses: actions/upload-artifact@v7
      with:
        name: renders
        path: out/
